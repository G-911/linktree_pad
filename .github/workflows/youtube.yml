name: Actualizar episodios de YouTube

on:
  # Revisión periódica: recoge estrenos y refresca el conteo de vistas del top.
  schedule:
    - cron: "*/30 * * * *"
  # Botón manual en la pestaña Actions.
  workflow_dispatch:
  # Webhook: un servicio externo puede disparar la actualización al instante con
  # POST https://api.github.com/repos/<usuario>/<repo>/dispatches
  # body: {"event_type": "youtube-nuevo-video"}
  repository_dispatch:
    types: [youtube-nuevo-video]

permissions:
  contents: write

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/actualizar-youtube.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet -- assets/data/youtube.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/data/youtube.json
          git commit -m "data: actualizar episodios de YouTube"
          git push
